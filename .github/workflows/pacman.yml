name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Setiap 12 jam
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Pacman Graph (Dark Mode)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: "dark"  # <-- Tambahkan parameter tema
          output_file: "pacman-contribution-graph-dark.svg"  # <-- Nama file khusus dark

      - name: Upload Dark Mode SVG
        uses: actions/upload-artifact@v3
        with:
          name: pacman-dark
          path: pacman-contribution-graph-dark.svg

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: output
          keep_files: true
          force_orphan: false
